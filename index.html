<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 오프라인 GPS 좌표 변환</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: system-ui, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  padding: 20px;
}
h1 { color: #ff5555; }
button {
  padding: 12px;
  font-size: 16px;
  width: 100%;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 8px;
}
.box {
  margin-top: 15px;
  padding: 12px;
  background: #161b22;
  border-radius: 8px;
}
.label { color: #8b949e; font-size: 14px; }
.value { font-size: 16px; margin-top: 4px; }
</style>
</head>

<body>

<h1>🆘 오프라인 GPS 좌표 변환</h1>

<button onclick="getLocation()">📡 현재 위치 확인</button>

<div class="box"><div class="label">위도 / 경도 (DD)</div><div id="dd" class="value">-</div></div>
<div class="box"><div class="label">도분초 (DMS)</div><div id="dms" class="value">-</div></div>
<div class="box"><div class="label">UTM-K (EPSG:5179)</div><div id="utmk" class="value">-</div></div>
<div class="box"><div class="label">MGRS 군사좌표</div><div id="mgrs" class="value">-</div></div>
<div class="box"><div class="label">GPS 정확도</div><div id="acc" class="value">-</div></div>

<script src="proj4.min.js"></script>
<script src="mgrs.min.js"></script>

<script>
// EPSG:5179 정의
proj4.defs("EPSG:5179",
  "+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 " +
  "+x_0=1000000 +y_0=2000000 +ellps=GRS80 +units=m +no_defs"
);

// 도 → 도분초
function toDMS(deg) {
  const d = Math.floor(deg);
  const mFloat = (deg - d) * 60;
  const m = Math.floor(mFloat);
  const s = ((mFloat - m) * 60).toFixed(2);
  return `${d}° ${m}′ ${s}″`;
}

// GPS 위치 수신
function getLocation() {
  if (!navigator.geolocation) {
    alert("GPS 미지원 기기");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      // DD
      document.getElementById("dd").innerText =
        `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

      // DMS
      document.getElementById("dms").innerText =
        `${toDMS(lat)} , ${toDMS(lon)}`;

      // UTM-K
      const [x, y] = proj4("WGS84", "EPSG:5179", [lon, lat]);
      document.getElementById("utmk").innerText =
        `X ${Math.floor(x)} / Y ${Math.floor(y)}`;

      // MGRS
      document.getElementById("mgrs").innerText =
        mgrs.forward([lon, lat], 5);

      // 정확도
      document.getElementById("acc").innerText =
        `± ${Math.round(acc)} m`;
    },
    err => alert("GPS 수신 실패"),
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
