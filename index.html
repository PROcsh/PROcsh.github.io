<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 현장 좌표 변환기 (GPS 오프라인)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  font-family:system-ui,Arial;
  background:#0f172a;
  color:#fff;
}
h1{font-size:20px;margin-bottom:12px;text-align:center}
.card{
  background:#020617;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:18px;
  margin-top:10px;
  font-size:17px;
  font-weight:700;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#020617;
}
pre{
  white-space:pre-wrap;
  line-height:1.6;
  font-size:15px;
  background:#020617;
  border:1px solid #1e293b;
  border-radius:14px;
  padding:14px;
}
.small{font-size:13px;color:#94a3b8;text-align:center}
</style>
</head>

<body>

<h1>🆘 현장 좌표 변환기 (GPS)</h1>

<div class="card">
  <button onclick="getMyLocation()">📡 내 위치(GPS)</button>
</div>

<div class="card">
  <pre id="result">GPS 버튼을 누르세요</pre>
</div>

<p class="small">
✔ 지도 없음 · ✔ 인터넷 불필요 · ✔ 위성(GPS)만 사용
</p>

<script>
/* TM / UTM-K (EPSG:5179) */
proj4.defs("EPSG:5179",
"+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 +x_0=1000000 +y_0=2000000 +ellps=GRS80 +units=m +no_defs");

const result = document.getElementById("result");

/* DD → DMS */
function toDMS(d){
  const D = Math.floor(d);
  const M = Math.floor((d - D) * 60);
  const S = (((d - D) * 60 - M) * 60).toFixed(2);
  return `${D}° ${M}′ ${S}″`;
}

/* 국가지점번호 */
function national(x,y){
  return `${Math.floor(x/100)} ${Math.floor(y/100)}`;
}

/* GPS 수신 */
function getMyLocation(){
  if(!navigator.geolocation){
    alert("GPS를 지원하지 않는 기기입니다");
    return;
  }

  result.textContent = "📡 위성 신호 수신 중...\n(야외에서 잠시 대기하세요)";

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);

      const tm = proj4("WGS84","EPSG:5179",[lon,lat]);
      const mgrsCode = mgrs.forward([lon,lat],5);

      localStorage.setItem("lastLat",lat);
      localStorage.setItem("lastLon",lon);

      result.textContent =
`📍 현재 위치 (GPS)

WGS84 (DD)
${lat.toFixed(6)}, ${lon.toFixed(6)}

DMS
${toDMS(lat)}
${toDMS(lon)}

TM / UTM-K
E ${Math.floor(tm[0])}
N ${Math.floor(tm[1])}

국가지점번호
${national(tm[0],tm[1])}

MGRS
${mgrsCode}

GPS 정확도 ±${acc} m`;
    },
    err=>{
      alert("위치 수신 실패\n야외로 이동하세요");
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
}

/* 마지막 위치 자동 표시 */
window.onload=()=>{
  const lat=localStorage.getItem("lastLat");
  const lon=localStorage.getItem("lastLon");
  if(lat && lon){
    result.textContent =
`📦 마지막 저장 위치

${Number(lat).toFixed(6)}, ${Number(lon).toFixed(6)}

(오프라인에서도 사용 가능)`;
  }
};

/* Service Worker */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
