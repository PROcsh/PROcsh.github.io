<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>📡 오프라인 GPS 좌표 변환기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 정확한 좌표 변환 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<style>
body {
  background:#111;
  color:#fff;
  font-family: Arial, sans-serif;
  padding:20px;
}
h1 {
  color:#00eaff;
  text-align:center;
}
button {
  width:100%;
  padding:14px;
  font-size:18px;
  background:#00eaff;
  border:none;
  border-radius:8px;
  margin:10px 0;
}
.box {
  background:#222;
  padding:15px;
  border-radius:8px;
  margin-top:10px;
  line-height:1.6;
}
.label { color:#aaa; font-size:14px; }
.value { font-size:17px; }
</style>
</head>

<body>

<h1>🆘 오프라인 GPS 좌표 변환</h1>

<button onclick="getLocation()">📡 현재 위치 수신</button>

<div class="box">
  <div class="label">위도 (DD)</div>
  <div id="lat" class="value">-</div>

  <div class="label">경도 (DD)</div>
  <div id="lon" class="value">-</div>
</div>

<div class="box">
  <div class="label">도분초 (DMS)</div>
  <div id="dms" class="value">-</div>
</div>

<div class="box">
  <div class="label">UTM-K (EPSG:5179)</div>
  <div id="utmk" class="value">-</div>
</div>

<div class="box">
  <div class="label">국가지점번호 (100m)</div>
  <div id="national" class="value">-</div>
</div>

<script>
/* ======================
   EPSG:5179 정의
====================== */
proj4.defs("EPSG:5179",
  "+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 " +
  "+x_0=1000000 +y_0=2000000 +ellps=GRS80 +units=m +no_defs"
);

/* ======================
   GPS 수신
====================== */
function getLocation() {
  if (!navigator.geolocation) {
    alert("GPS 미지원 기기");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      localStorage.setItem("lastLat", lat);
      localStorage.setItem("lastLon", lon);

      processCoord(lat, lon);
    },
    err => alert("GPS 수신 실패"),
    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}

/* ======================
   좌표 처리
====================== */
function processCoord(lat, lon) {
  document.getElementById("lat").innerText = lat.toFixed(6);
  document.getElementById("lon").innerText = lon.toFixed(6);
  document.getElementById("dms").innerText = toDMS(lat, lon);

  const tm = wgs84ToUTMK(lat, lon);

  document.getElementById("utmk").innerText =
    "E " + Math.floor(tm.x) + "  N " + Math.floor(tm.y);

  document.getElementById("national").innerText =
    nationalPointFromUTMK(tm);
}

/* ======================
   도 → 도분초
====================== */
function dms(v) {
  const deg = Math.floor(Math.abs(v));
  const minFloat = (Math.abs(v) - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = ((minFloat - min) * 60).toFixed(2);
  return `${deg}° ${min}' ${sec}"`;
}

function toDMS(lat, lon) {
  return `N ${dms(lat)} / E ${dms(lon)}`;
}

/* ======================
   WGS84 → UTM-K
====================== */
function wgs84ToUTMK(lat, lon){
  const [x, y] = proj4("WGS84", "EPSG:5179", [lon, lat]);
  return { x, y };
}

/* ======================
   국가지점번호
====================== */
function nationalPointFromUTMK(tm){
  return `${Math.floor(tm.x / 100)} ${Math.floor(tm.y / 100)}`;
}
</script>

</body>
</html>
