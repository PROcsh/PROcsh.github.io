<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>📡 오프라인 GPS 좌표 변환기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background:#111;
  color:#fff;
  font-family: Arial, sans-serif;
  padding:20px;
}
h1 { color:#00eaff; }
  h1 { text-align: center; }
button {
  width:100%;
  padding:14px;
  font-size:18px;
  background:#00eaff;
  border:none;
  border-radius:8px;
  margin:10px 0;
}
.box {
  background:#222;
  padding:15px;
  border-radius:8px;
  margin-top:10px;
  line-height:1.6;
}
.label { color:#aaa; font-size:14px; }
.value { font-size:17px; }
</style>
</head>

<body>

<h1>🆘 오프라인 GPS 좌표 변환</h1>

<button onclick="getLocation()">📡 현재 위치 수신</button>

<div class="box">
  <div class="label">위도 (도)</div>
  <div id="lat" class="value">-</div>

  <div class="label">경도 (도)</div>
  <div id="lon" class="value">-</div>
</div>

<div class="box">
  <div class="label">도분초 (DMS)</div>
  <div id="dms" class="value">-</div>
</div>

<div class="box">
  <div class="label">UTM-K</div>
  <div id="utm" class="value">-</div>
</div>

<div class="box">
  <div class="label">TM (Korea Central)</div>
  <div id="tm" class="value">-</div>
</div>

<div class="box">
  <div class="label">군사좌표 (MGRS)</div>
  <div id="mgrs" class="value">-</div>
</div>

<script>
/* ======================
   GPS 수신
====================== */
function getLocation() {
  if (!navigator.geolocation) {
    alert("GPS 지원 안됨");
    return;
  }

  // 마지막 좌표 즉시 표시
  const lastLat = localStorage.getItem("lastLat");
  const lastLon = localStorage.getItem("lastLon");
  if (lastLat && lastLon) {
    processCoord(parseFloat(lastLat), parseFloat(lastLon));
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      localStorage.setItem("lastLat", lat);
      localStorage.setItem("lastLon", lon);

      processCoord(lat, lon);
    },
    err => alert("GPS 수신 실패"),
    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:60000
    }
  );
}

/* ======================
   좌표 처리
====================== */
function processCoord(lat, lon) {
  document.getElementById("lat").innerText = lat.toFixed(6);
  document.getElementById("lon").innerText = lon.toFixed(6);
  document.getElementById("dms").innerText = toDMS(lat, lon);

  const utm = latLonToUTM(lat, lon);
  document.getElementById("utm").innerText =
    utm.zone + " " + utm.easting + " " + utm.northing;

  const tm = latLonToTM(lat, lon);
  document.getElementById("tm").innerText =
    "X: " + tm.x + "  Y: " + tm.y;

  document.getElementById("mgrs").innerText =
    utm.zone + utm.band + " " +
    utm.easting.toString().slice(0,3) + " " +
    utm.northing.toString().slice(0,3);
}

/* ======================
   도 → 도분초
====================== */
function dms(v) {
  const deg = Math.floor(Math.abs(v));
  const minFloat = (Math.abs(v) - deg) * 60;
  const min = Math.floor(minFloat);
  const sec = ((minFloat - min) * 60).toFixed(2);
  return `${deg}° ${min}' ${sec}"`;
}

function toDMS(lat, lon) {
  return `N ${dms(lat)} / E ${dms(lon)}`;
}

/* ======================
   UTM 변환 (단순)
====================== */
function latLonToUTM(lat, lon) {
  const zone = Math.floor((lon + 180) / 6) + 1;
  const band = "CDEFGHJKLMNPQRSTUVWX"[Math.floor((lat + 80) / 8)];

  const a = 6378137;
  const k0 = 0.9996;

  const latRad = lat * Math.PI / 180;
  const lonRad = lon * Math.PI / 180;
  const lonOrigin = (zone - 1) * 6 - 180 + 3;
  const lonOriginRad = lonOrigin * Math.PI / 180;

  const e = 0.081819191;
  const N = a / Math.sqrt(1 - e * e * Math.sin(latRad) ** 2);
  const T = Math.tan(latRad) ** 2;
  const C = (e * e / (1 - e * e)) * Math.cos(latRad) ** 2;
  const A = Math.cos(latRad) * (lonRad - lonOriginRad);

  const M = a * (
    (1 - e*e/4 - 3*e**4/64) * latRad
  );

  let easting = k0 * N * A + 500000;
  let northing = k0 * M;
  if (lat < 0) northing += 10000000;

  return {
    zone, band,
    easting: Math.round(easting),
    northing: Math.round(northing)
  };
}

/* ======================
   TM 변환 (중부원점 근사)
====================== */
function latLonToTM(lat, lon) {
  const lat0 = 38;
  const lon0 = 127;

  const x = (lon - lon0) * 111320 * Math.cos(lat * Math.PI/180) + 200000;
  const y = (lat - lat0) * 110540 + 500000;

  return {
    x: Math.round(x),
    y: Math.round(y)
  };
}
</script>

</body>
</html>
